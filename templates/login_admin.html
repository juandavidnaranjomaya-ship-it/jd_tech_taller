<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JD TECH - Panel de Administrador</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md p-8 bg-slate-800 rounded-xl shadow-2xl border border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-400 tracking-wider">JD TECH</h1>
            <p class="text-sm text-slate-400 mt-2">Acceso al Panel de Administración</p>
        </div>

        <!-- Mensajes Flash de alerta o error -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-3 rounded-lg text-sm bg-red-500/20 border border-red-500 text-red-300 text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Formulario configurado con método POST hacia /login-admin -->
        <form action="/login-admin" method="POST" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2 text-center">Contraseña de Administrador</label>
                <input type="password" name="password" required autofocus
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-blue-500 text-slate-100 placeholder-slate-500 text-center tracking-widest text-lg"
                    placeholder="••••••">
            </div>

            <button type="submit" 
                class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg shadow-lg transition duration-200">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-sm text-slate-400 hover:text-blue-400 transition">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
